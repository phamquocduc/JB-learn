services:
  - type: web
    name: jb-learn-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate --noinput
    startCommand: gunicorn --chdir backend core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: MYSQL_SSL
        value: "True"
